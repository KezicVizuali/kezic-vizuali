<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio — Kezić Vizuali | Krunoslav Kezić</title>

    <!-- PWA: instalabilnost na mobitelu -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0806">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Studio">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon-192.png" type="image/png">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0806;
            --panel: rgba(19, 15, 11, 0.72);
            --panel-solid: #120e0a;
            --line: rgba(201, 164, 74, 0.16);
            --line-strong: rgba(201, 164, 74, 0.38);
            --gold-1: #f3e0a8;
            --gold-2: #cda43c;
            --gold-3: #8a6a24;
            --text: #f1ebdd;
            --text-dim: #948c7c;
            --text-faint: #5c5648;
            --danger: #e2685a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Jost', sans-serif;
            background:
                radial-gradient(ellipse 900px 480px at 50% -8%, rgba(205,164,60,0.14), transparent 62%),
                radial-gradient(ellipse 600px 400px at 100% 100%, rgba(138,106,36,0.08), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            color: var(--text);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .font-display { font-family: 'Cormorant Garamond', serif; }
        .gold-text {
            background: linear-gradient(135deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .panel {
            background: var(--panel);
            backdrop-filter: blur(18px);
            border: 1px solid var(--line);
            position: relative;
        }
        .panel-marked::before, .panel-marked::after {
            content: ""; position: absolute; width: 16px; height: 16px;
            border-color: var(--gold-2); opacity: 0.5; pointer-events: none;
        }
        .panel-marked::before { top: 16px; left: 16px; border-top: 1.5px solid; border-left: 1.5px solid; border-top-left-radius: 6px; }
        .panel-marked::after { bottom: 16px; right: 16px; border-bottom: 1.5px solid; border-right: 1.5px solid; border-bottom-right-radius: 6px; }
        .hairline { height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); }
        .fade-in { animation: fadeIn 0.35s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        select, input {
            background: #100c08 !important; border: 1px solid var(--line) !important; color: var(--text);
            outline: none; padding: 10px 12px; border-radius: 12px; width: 100%; font-size: 14px;
            font-family: 'Jost', sans-serif;
        }
        select:focus, input:focus { border-color: var(--gold-2) !important; }
        input[type=range] { padding: 0; accent-color: var(--gold-2); }
        input[type=color] { padding: 2px; height: 40px; cursor: pointer; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
            color: #1a1206; font-weight: 600;
        }
        .btn-ghost {
            background: transparent; border: 1px solid var(--line-strong); color: var(--gold-2);
        }
        .btn-muted {
            background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: var(--text-dim);
        }
        .nav-glass { background: rgba(13, 10, 7, 0.92); backdrop-filter: blur(24px); border: 1px solid var(--line); }
        .nav-active { background: linear-gradient(135deg, var(--gold-1), var(--gold-2) 60%, var(--gold-3)); color: #1a1206; }
        .row-line { border-bottom: 1px solid rgba(255,255,255,0.04); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- IKONE ---
        const Icon = ({ name, className = "w-5 h-5", style = {} }) => {
            const icons = {
                light: <React.Fragment><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z" /></React.Fragment>,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
                image: <React.Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></React.Fragment>,
                sun: <React.Fragment><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/></React.Fragment>,
                moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
                target: <React.Fragment><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></React.Fragment>,
                clock: <React.Fragment><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></React.Fragment>,
                download: <React.Fragment><path d="M20 15v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></React.Fragment>,
                settings: <React.Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></React.Fragment>,
                pin: <React.Fragment><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></React.Fragment>,
                check: <polyline points="20 6 9 17 4 12" />,
                ruler: <React.Fragment><path d="M3 17l14-14 4 4-14 14z"/><path d="M14 6l2 2M11 9l2 2M8 12l2 2"/></React.Fragment>,
                bars: <React.Fragment><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="15"/><line x1="20" y1="20" x2="20" y2="9"/></React.Fragment>,
                info: <React.Fragment><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12" y2="8.01"/></React.Fragment>,
                alert: <React.Fragment><path d="M12 2L1 21h22L12 2z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17.01"/></React.Fragment>,
                chevron: <polyline points="6 9 12 15 18 9" />,
                book: <React.Fragment><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></React.Fragment>,
                doc: <React.Fragment><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></React.Fragment>
            };
            return (
                <svg viewBox="0 0 24 24" className={className} style={style} fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        // --- MODUL: RASVJETA ---
        const LightingModule = () => {
            const [mode, setMode] = useState('studio');
            const [setup, setSetup] = useState('rembrandt');
            const [lights, setLights] = useState(['key']);
            const [gel, setGel] = useState('#f3e0a8');

            const setups = {
                rembrandt: { n: 'Rembrandt', p: 'top-1/4 left-1/4', d: 'Trokut svjetla na tamnom obrazu.' },
                butterfly: { n: 'Butterfly', p: 'top-4 left-1/2 -translate-x-1/2', d: 'Glamur sjena ispod nosa.' },
                split: { n: 'Split', p: 'top-1/2 left-4 -translate-y-1/2', d: 'Dramatično dijeli lice na dvije strane.' },
                clamshell: { n: 'Clamshell', p: 'top-8 left-1/2 -translate-x-1/2', d: 'Ujednačeno svjetlo bez sjena.' }
            };
            const field = {
                golden: { n: 'Zlatni sat', p: 'top-1/3 left-4', c: '#cda43c', i: 'sun', d: 'Toplo svjetlo niskog kuta.' },
                noon: { n: 'Podne', p: 'top-2 left-1/2 -translate-x-1/2', c: '#f3e0a8', i: 'sun', d: 'Oštre sjene odozgo.' },
                blue: { n: 'Plavi sat', p: 'top-1/4 right-4', c: '#5b6ea8', i: 'moon', d: 'Hladni tonovi sumraka.' }
            };

            const curSet = mode === 'studio' ? setups : field;
            const cur = curSet[setup] || curSet[Object.keys(curSet)[0]];

            const kelvinRef = [
                { l: 'Svijeća', v: '1900K' },
                { l: 'Volfram / žarulja', v: '3200K' },
                { l: 'Zlatni sat', v: '3500K' },
                { l: 'Dnevno svjetlo (podne)', v: '5600K' },
                { l: 'Oblačno nebo', v: '6500–7500K' },
                { l: 'Sjena', v: '8000K' },
                { l: 'Plavi sat', v: '10000K+' }
            ];

            return (
                <div className="space-y-4 fade-in">
                    <div className="flex p-1 bg-black/30 rounded-2xl border" style={{borderColor:'var(--line)'}}>
                        <button onClick={() => {setMode('studio'); setSetup('rembrandt');}} className={`flex-1 py-2 rounded-xl text-[11px] font-medium tracking-wide transition-all ${mode==='studio'?'nav-active':'text-zinc-500'}`}>Studio</button>
                        <button onClick={() => {setMode('teren'); setSetup('golden');}} className={`flex-1 py-2 rounded-xl text-[11px] font-medium tracking-wide transition-all ${mode==='teren'?'nav-active':'text-zinc-500'}`}>Teren</button>
                    </div>
                    <div className="panel p-6 rounded-[2rem] relative overflow-hidden">
                        <div className="flex justify-between items-start mb-6">
                            <div><h3 className="font-display text-2xl italic text-[var(--text)] mb-1">{cur.n}</h3><p className="text-[var(--text-dim)] text-[12px] leading-relaxed max-w-[200px]">{cur.d}</p></div>
                            {mode === 'studio' && (
                                <div className="flex gap-1.5">
                                    {['#f3e0a8','#cda43c','#e2685a','#5b6ea8'].map(c => (
                                        <button key={c} onClick={()=>setGel(c)} className={`w-5 h-5 rounded-full border-2 transition-all ${gel===c?'border-white scale-110':'border-transparent opacity-50'}`} style={{backgroundColor:c}} />
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className={`grid ${mode==='studio'?'grid-cols-2':'grid-cols-3'} gap-2 mb-6`}>
                            {Object.entries(curSet).map(([key, val]) => (
                                <button key={key} onClick={() => setSetup(key)} className={`py-2.5 rounded-xl text-[10px] font-semibold tracking-wider border transition-all ${setup===key?'nav-active border-transparent':'bg-black/30 text-zinc-500'}`} style={setup!==key?{borderColor:'var(--line)'}:{}}>{val.n.toUpperCase()}</button>
                            ))}
                        </div>
                        <div className="bg-black aspect-video rounded-2xl flex items-center justify-center relative border overflow-hidden mb-6" style={{borderColor:'var(--line)'}}>
                            <div className="absolute inset-0 opacity-25 blur-3xl transition-all duration-1000" style={{ backgroundColor: mode==='teren'?cur.c:gel }}></div>
                            <div className="w-20 h-20 border rounded-full bg-black/40 flex items-center justify-center z-10 font-medium text-[9px] uppercase tracking-widest text-zinc-600" style={{borderColor:'var(--line-strong)'}}>Model</div>
                            {lights.includes('key') && (
                                <div className={`absolute transition-all duration-700 ${cur.p}`}>
                                    <div className="relative">
                                        <div className="absolute inset-0 blur-3xl scale-[2.5] bg-white/10 animate-pulse"></div>
                                        <Icon name={mode==='teren'?(cur.i || 'sun'):'light'} style={{color: mode==='teren'?cur.c:gel}} className="w-10 h-10 relative z-10" />
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            {['key', 'fill', 'rim'].map(l => (
                                <button key={l} onClick={() => setLights(p => p.includes(l)?p.filter(i=>i!==l):[...p,l])} className={`py-3 rounded-xl text-[9px] font-semibold tracking-wider border transition-all ${lights.includes(l)?'nav-active border-transparent':'bg-black/30 text-zinc-600'}`} style={!lights.includes(l)?{borderColor:'var(--line)'}:{}}>{l.toUpperCase()} LIGHT</button>
                            ))}
                        </div>
                    </div>
                    <div className="panel p-6 rounded-[2rem]">
                        <p className="text-[10px] text-[var(--text-dim)] uppercase tracking-widest mb-3">Bijela ravnoteža — Kelvin vodič</p>
                        <div className="space-y-0.5">
                            {kelvinRef.map((k,i) => (
                                <div key={i} className="flex justify-between items-center py-2 row-line text-[12px]">
                                    <span className="text-zinc-400">{k.l}</span>
                                    <span className="font-medium gold-text">{k.v}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODUL: OPTIKA / EKSPOZICIJA ---
        const OpticsModule = () => {
            const [oMode, setOMode] = useState('nd');
            const [iso, setIso] = useState(100); const [f, setF] = useState(8); const [t, setT] = useState(125);
            const [nd, setNd] = useState(0);
            const [gn, setGn] = useState(20); const [flashDist, setFlashDist] = useState(3); const [flashIso, setFlashIso] = useState(100);

            const finalT = (1/t) * Math.pow(2, nd);
            const fmt = (s) => s < 1 ? `1/${Math.round(1/s)}s` : s < 60 ? `${s.toFixed(1)}s` : `${Math.floor(s/60)}m ${Math.round(s%60)}s`;
            const flashAperture = (gn * Math.sqrt(flashIso/100)) / Math.max(flashDist, 0.1);

            const sunnyRows = [
                { l: 'Puno sunce', f: 16 },
                { l: 'Blaga naoblaka', f: 11 },
                { l: 'Oblačno', f: 8 },
                { l: 'Jaka naoblaka / hlad', f: 5.6 },
                { l: 'Zalazak / zora', f: 4 }
            ];
            const nearestShutter = [2000,1000,500,250,125,60,30,15,8,4,2].reduce((a,b)=>Math.abs(b-iso)<Math.abs(a-iso)?b:a);

            return (
                <div className="space-y-4 fade-in">
                    <div className="flex p-1 bg-black/30 rounded-2xl border" style={{borderColor:'var(--line)'}}>
                        <button onClick={() => setOMode('nd')} className={`flex-1 py-2 rounded-xl text-[10px] font-medium tracking-wide transition-all ${oMode==='nd'?'nav-active':'text-zinc-500'}`}>ND filtar</button>
                        <button onClick={() => setOMode('teren')} className={`flex-1 py-2 rounded-xl text-[10px] font-medium tracking-wide transition-all ${oMode==='teren'?'nav-active':'text-zinc-500'}`}>Sunny 16</button>
                        <button onClick={() => setOMode('flash')} className={`flex-1 py-2 rounded-xl text-[10px] font-medium tracking-wide transition-all ${oMode==='flash'?'nav-active':'text-zinc-500'}`}>Bljeskalica</button>
                    </div>

                    {oMode==='nd' && (
                        <div className="panel p-6 rounded-[2rem] space-y-6">
                            <div className="grid grid-cols-3 gap-3">
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">ISO</p><select value={iso} onChange={e=>setIso(Number(e.target.value))}>{[100,200,400,800,1600,3200].map(v=><option key={v} value={v}>{v}</option>)}</select></div>
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Blenda</p><select value={f} onChange={e=>setF(Number(e.target.value))}>{[2.8,4,8,11,16,22].map(v=><option key={v} value={v}>f/{v}</option>)}</select></div>
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Baza t (bez filtra)</p><select value={t} onChange={e=>setT(Number(e.target.value))}>{[1000,500,250,125,60,30,15].map(v=><option key={v} value={v}>1/{v}s</option>)}</select></div>
                            </div>
                            <div className="pt-4 border-t" style={{borderColor:'var(--line)'}}>
                                <div className="flex justify-between mb-1"><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase">ND filter</p><p className="text-[11px] gold-text font-semibold">{nd === 0 ? 'Bez filtra' : `ND${Math.pow(2,nd)} (+${nd} EV)`}</p></div>
                                <input type="range" min="0" max="10" step="1" value={nd} onChange={e=>setNd(Number(e.target.value))} />
                            </div>
                            <div className="panel-marked bg-black p-6 rounded-2xl border-l-2 text-center" style={{borderColor:'var(--gold-2)'}}>
                                <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest mb-1">Nova ekspozicija</p>
                                <p className="text-4xl font-display italic gold-text tracking-tight">{fmt(finalT)}</p>
                                {finalT > 1 && <p className="text-[11px] text-zinc-400 font-medium mt-2 uppercase tracking-widest italic">Recipročnost (film): {fmt(Math.pow(finalT, 1.35))}</p>}
                            </div>
                            {finalT > 1 && <p className="text-[10px] text-zinc-600 text-center px-4 leading-relaxed">Kod dugih ekspozicija film gubi osjetljivost (recipročnost) pa treba dulje vrijeme od izračunatog — digitalni senzori to ne trebaju.</p>}
                        </div>
                    )}

                    {oMode==='teren' && (
                        <div className="panel p-6 rounded-[2rem] space-y-5">
                            <div>
                                <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">ISO</p>
                                <select value={iso} onChange={e=>setIso(Number(e.target.value))}>{[50,100,200,400,800].map(v=><option key={v} value={v}>{v}</option>)}</select>
                            </div>
                            <div className="space-y-2">
                                {sunnyRows.map(r => (
                                    <div key={r.l} className="flex justify-between items-center bg-black/30 p-3 rounded-xl border" style={{borderColor:'var(--line)'}}>
                                        <span className="text-[10px] text-zinc-400 uppercase font-semibold tracking-wide">{r.l}</span>
                                        <span className="text-[12px] gold-text font-semibold">f/{r.f} @ 1/{nearestShutter}s</span>
                                    </div>
                                ))}
                            </div>
                            <p className="text-[10px] text-zinc-600 text-center px-2 leading-relaxed">Pravilo "Sunny 16": po punom suncu, blenda f/16 uz vrijeme ≈ 1/ISO daje ispravnu ekspoziciju. Za slabije svjetlo otvaraš blendu, vrijeme ostaje isto.</p>
                        </div>
                    )}

                    {oMode==='flash' && (
                        <div className="panel p-6 rounded-[2rem] space-y-6">
                            <div className="grid grid-cols-2 gap-3">
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Guide Number (m, ISO100)</p><input type="number" value={gn} onChange={e=>setGn(Number(e.target.value)||1)} /></div>
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">ISO</p><select value={flashIso} onChange={e=>setFlashIso(Number(e.target.value))}>{[100,200,400,800,1600,3200].map(v=><option key={v} value={v}>{v}</option>)}</select></div>
                            </div>
                            <div>
                                <div className="flex justify-between mb-1"><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase">Udaljenost do motiva</p><p className="text-[11px] gold-text font-semibold">{flashDist} m</p></div>
                                <input type="range" min="0.5" max="20" step="0.1" value={flashDist} onChange={e=>setFlashDist(Number(e.target.value))} />
                            </div>
                            <div className="panel-marked bg-black p-6 rounded-2xl border-l-2 text-center" style={{borderColor:'var(--gold-2)'}}>
                                <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest mb-1">Potrebna blenda</p>
                                <p className="text-4xl font-display italic gold-text tracking-tight">f/{flashAperture.toFixed(1)}</p>
                                <p className="text-[10px] text-zinc-600 mt-2">Blenda = (GN × √(ISO/100)) ÷ udaljenost</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODUL: DUBINSKA OŠTRINA ---
        const DofModule = ({ units }) => {
            const [focal, setFocal] = useState(50);
            const [aperture, setAperture] = useState(8);
            const [distance, setDistance] = useState(5);
            const [sensor, setSensor] = useState('ff');

            const coc = { ff: 0.030, apsc_c: 0.019, apsc_n: 0.020, mft: 0.015, mf: 0.036, lf: 0.146 };
            const sensorNames = { ff: 'Puni format (35mm)', apsc_c: 'APS-C (Canon 1.6x)', apsc_n: 'APS-C (Nikon/Sony 1.5x)', mft: 'Micro 4/3', mf: 'Srednji format 44x33', lf: 'Veliki format 4x5"' };
            const diffractionSafe = { ff: 11, apsc_c: 8, apsc_n: 8, mft: 5.6, mf: 16, lf: 32 };

            const c = coc[sensor];
            const H_mm = (focal * focal) / (aperture * c) + focal;
            const H_m = H_mm / 1000;
            const s = distance;
            const near = (H_m * s) / (H_m + s - (focal/1000));
            const far = s < H_m ? (H_m * s) / (H_m - s + (focal/1000)) : Infinity;
            const totalDof = far === Infinity ? Infinity : far - near;
            const imperial = units === 'imperial';

            const fmtDist = (v) => {
                if (v === Infinity) return '∞';
                if (imperial) {
                    const ft = v * 3.28084;
                    return ft < 1 ? `${Math.round(v*39.3701)}"` : `${ft.toFixed(2)} ft`;
                }
                return v < 1 ? `${Math.round(v*100)} cm` : `${v.toFixed(2)} m`;
            };
            const distLabel = imperial ? `${(distance*3.28084).toFixed(1)} ft` : `${distance} m`;
            const diffractionWarn = aperture > diffractionSafe[sensor];

            return (
                <div className="space-y-4 fade-in">
                    <div className="panel p-6 rounded-[2rem] space-y-5">
                        <div>
                            <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Format senzora</p>
                            <select value={sensor} onChange={e=>setSensor(e.target.value)}>
                                {Object.entries(sensorNames).map(([k,n]) => <option key={k} value={k}>{n}</option>)}
                            </select>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Žarišna daljina (mm)</p><input type="number" value={focal} onChange={e=>setFocal(Number(e.target.value)||1)} /></div>
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Blenda (f/)</p><select value={aperture} onChange={e=>setAperture(Number(e.target.value))}>{[1.4,1.8,2,2.8,4,5.6,8,11,16,22].map(v=><option key={v} value={v}>f/{v}</option>)}</select></div>
                        </div>
                        <div>
                            <div className="flex justify-between mb-1"><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase">Udaljenost do motiva</p><p className="text-[11px] gold-text font-semibold">{distLabel}</p></div>
                            <input type="range" min="0.3" max="50" step="0.1" value={distance} onChange={e=>setDistance(Number(e.target.value))} />
                        </div>
                        {diffractionWarn && (
                            <div className="flex items-start gap-2 bg-black/40 border rounded-xl p-3" style={{borderColor:'rgba(226,104,90,0.35)'}}>
                                <Icon name="alert" className="w-4 h-4 mt-0.5 flex-shrink-0" style={{color:'var(--danger)'}} />
                                <p className="text-[10px] text-zinc-400 leading-relaxed">Kod ovog senzora, blende uže od f/{diffractionSafe[sensor]} mogu unijeti primjetno difrakcijsko meknjenje detalja.</p>
                            </div>
                        )}
                    </div>

                    <div className="panel-marked panel p-6 rounded-[2rem] space-y-4">
                        <div className="grid grid-cols-2 gap-3 text-center">
                            <div className="bg-black p-4 rounded-2xl border" style={{borderColor:'var(--line)'}}>
                                <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Bliža granica</p>
                                <p className="text-lg font-semibold text-[var(--text)]">{fmtDist(near)}</p>
                            </div>
                            <div className="bg-black p-4 rounded-2xl border" style={{borderColor:'var(--line)'}}>
                                <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Dalja granica</p>
                                <p className="text-lg font-semibold text-[var(--text)]">{fmtDist(far)}</p>
                            </div>
                        </div>
                        <div className="bg-black p-5 rounded-2xl border-l-2 text-center" style={{borderColor:'var(--gold-2)'}}>
                            <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest mb-1">Ukupna dubinska oštrina</p>
                            <p className="text-2xl font-display italic gold-text">{totalDof === Infinity ? '∞' : `${totalDof.toFixed(2)} m`}</p>
                        </div>
                        <div className="bg-black p-4 rounded-2xl border text-center" style={{borderColor:'var(--line)'}}>
                            <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Hiperfokalna udaljenost</p>
                            <p className="text-sm font-semibold gold-text">{H_m.toFixed(2)} m</p>
                            <p className="text-[9px] text-zinc-600 mt-1">Fokusiraj ovdje za max. oštrinu od {fmtDist(H_m/2)} do ∞</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODUL: ZLATNI/PLAVI SAT ---
        const GoldenHourModule = () => {
            const [status, setStatus] = useState('idle');
            const [times, setTimes] = useState(null);
            const [weather, setWeather] = useState(null);
            const [manualLat, setManualLat] = useState('');
            const [manualLng, setManualLng] = useState('');
            const [err, setErr] = useState('');

            const fetchWeather = async (lat, lng, sunriseIso, sunsetIso) => {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=cloudcover,precipitation_probability&timezone=auto&forecast_days=1`);
                    const data = await res.json();
                    if (!data.hourly) return;
                    const closestIdx = (iso) => {
                        const target = new Date(iso).getTime();
                        let best = 0, bestDiff = Infinity;
                        data.hourly.time.forEach((tstr, i) => {
                            const diff = Math.abs(new Date(tstr).getTime() - target);
                            if (diff < bestDiff) { bestDiff = diff; best = i; }
                        });
                        return best;
                    };
                    const sr = closestIdx(sunriseIso), ss = closestIdx(sunsetIso);
                    setWeather({
                        sunriseCloud: data.hourly.cloudcover[sr],
                        sunriseRain: data.hourly.precipitation_probability ? data.hourly.precipitation_probability[sr] : null,
                        sunsetCloud: data.hourly.cloudcover[ss],
                        sunsetRain: data.hourly.precipitation_probability ? data.hourly.precipitation_probability[ss] : null
                    });
                } catch (e) { /* vremenska prognoza je opcionalna, ne blokiraj glavni izračun */ }
            };

            const fetchTimes = async (lat, lng) => {
                setStatus('loading'); setErr(''); setWeather(null);
                try {
                    const res = await fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`);
                    const data = await res.json();
                    if (data.status !== 'OK') { setErr('Servis nije vratio podatke za tu lokaciju.'); setStatus('idle'); return; }
                    setTimes(data.results);
                    setStatus('done');
                    fetchWeather(lat, lng, data.results.sunrise, data.results.sunset);
                } catch (e) { setErr('Ne mogu dohvatiti podatke, provjeri internetsku vezu.'); setStatus('idle'); }
            };

            const useGeolocation = () => {
                if (!navigator.geolocation) { setErr('Geolokacija nije podržana u ovom browseru.'); return; }
                setStatus('loading');
                navigator.geolocation.getCurrentPosition(
                    (pos) => { fetchTimes(pos.coords.latitude, pos.coords.longitude); },
                    () => { setErr('Pristup lokaciji odbijen. Unesi koordinate ručno ispod.'); setStatus('idle'); }
                );
            };

            const useManual = () => {
                const lat = parseFloat(manualLat), lng = parseFloat(manualLng);
                if (isNaN(lat) || isNaN(lng)) { setErr('Unesi ispravne koordinate (npr. 45.81, 15.98).'); return; }
                fetchTimes(lat, lng);
            };

            const fmtTime = (iso) => new Date(iso).toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' });
            const addMin = (iso, min) => new Date(new Date(iso).getTime() + min*60000).toISOString();
            const fmtDayLength = (sec) => `${Math.floor(sec/3600)}h ${Math.round((sec%3600)/60)}min`;

            const Row = ({icon, label, value, accent}) => (
                <div className="flex items-center justify-between bg-black p-4 rounded-2xl border" style={{borderColor:'var(--line)'}}>
                    <div className="flex items-center gap-3">
                        <Icon name={icon} className="w-5 h-5" style={{color: accent}} />
                        <span className="text-[11px] font-medium uppercase tracking-widest text-zinc-400">{label}</span>
                    </div>
                    <span className="text-sm font-semibold text-[var(--text)]">{value}</span>
                </div>
            );

            return (
                <div className="space-y-4 fade-in">
                    <div className="panel p-6 rounded-[2rem] space-y-4">
                        <button onClick={useGeolocation} className="w-full py-3 rounded-2xl btn-gold text-[11px] font-semibold uppercase tracking-wide flex items-center justify-center gap-2">
                            <Icon name="pin" className="w-4 h-4" /> Koristi moju lokaciju
                        </button>
                        <p className="text-center text-[9px] text-zinc-600 uppercase tracking-widest">ili unesi ručno</p>
                        <div className="grid grid-cols-2 gap-2">
                            <input placeholder="Lat, npr. 45.81" value={manualLat} onChange={e=>setManualLat(e.target.value)} />
                            <input placeholder="Lng, npr. 15.98" value={manualLng} onChange={e=>setManualLng(e.target.value)} />
                        </div>
                        <button onClick={useManual} className="w-full py-2 rounded-2xl btn-muted text-[10px] font-semibold uppercase">Izračunaj za koordinate</button>
                        {err && <p className="text-[11px] text-center" style={{color:'var(--danger)'}}>{err}</p>}
                    </div>

                    {status === 'loading' && <p className="text-center py-4 animate-pulse uppercase text-xs font-semibold tracking-widest gold-text">Dohvaćam podatke...</p>}

                    {times && status === 'done' && (
                        <div className="panel p-6 rounded-[2rem] space-y-3">
                            <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest text-center mb-2">Za danas, tvoje lokalno vrijeme</p>
                            <Row icon="moon" label="Plavi sat (jutro)" value={`${fmtTime(times.civil_twilight_begin)} – ${fmtTime(times.sunrise)}`} accent="#5b6ea8" />
                            <Row icon="sun" label="Zlatni sat (jutro)" value={`${fmtTime(times.sunrise)} – ${fmtTime(addMin(times.sunrise,60))}`} accent="#cda43c" />
                            <Row icon="sun" label="Sunčano podne" value={fmtTime(times.solar_noon)} accent="#f3e0a8" />
                            <Row icon="sun" label="Zlatni sat (večer)" value={`${fmtTime(addMin(times.sunset,-60))} – ${fmtTime(times.sunset)}`} accent="#cda43c" />
                            <Row icon="moon" label="Plavi sat (večer)" value={`${fmtTime(times.sunset)} – ${fmtTime(times.civil_twilight_end)}`} accent="#5b6ea8" />
                            <Row icon="clock" label="Duljina dana" value={fmtDayLength(times.day_length)} accent="#948c7c" />
                        </div>
                    )}

                    {weather && status === 'done' && (
                        <div className="panel p-6 rounded-[2rem] space-y-3">
                            <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest text-center mb-2">Prognoza naoblake (Open-Meteo)</p>
                            <Row icon="sun" label="Naoblaka pri izlasku" value={`${weather.sunriseCloud}% oblačno${weather.sunriseRain!==null?`, ${weather.sunriseRain}% kiša`:''}`} accent="#cda43c" />
                            <Row icon="moon" label="Naoblaka pri zalasku" value={`${weather.sunsetCloud}% oblačno${weather.sunsetRain!==null?`, ${weather.sunsetRain}% kiša`:''}`} accent="#5b6ea8" />
                            <p className="text-[9px] text-zinc-600 text-center px-2 leading-relaxed pt-1">Niska naoblaka (0–30%) obično daje čist, dramatičan zlatni sat; srednja (40–70%) često donosi najbolje boje na oblacima.</p>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODUL: WATERMARK ---
        const WatermarkModule = ({ defaultText }) => {
            const [img, setImg] = useState(null);
            const [text, setText] = useState(defaultText || 'Kezić Vizuali — Krunoslav Kezić');
            const [opacity, setOpacity] = useState(70);
            const [size, setSize] = useState(24);
            const [position, setPosition] = useState('br');
            const [color, setColor] = useState('#ffffff');
            const [italic, setItalic] = useState(false);
            const canvasRef = useRef(null);
            const imgElRef = useRef(null);

            const handleUp = (e) => {
                const f = e.target.files[0]; if (!f) return;
                const url = URL.createObjectURL(f);
                const image = new Image();
                image.onload = () => { imgElRef.current = image; setImg(url); };
                image.src = url;
            };

            useEffect(() => { if (img) draw(); }, [img, text, opacity, size, position, color, italic]);

            const hexToRgba = (hex, a) => {
                const v = hex.replace('#','');
                const r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
                return `rgba(${r},${g},${b},${a})`;
            };

            const draw = () => {
                const canvas = canvasRef.current; const image = imgElRef.current;
                if (!canvas || !image) return;
                canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0);
                const fontSize = Math.round((size/100) * canvas.width * 0.06) + 12;
                ctx.font = `${italic?'italic ':''}600 ${fontSize}px Jost, sans-serif`;
                ctx.fillStyle = hexToRgba(color, opacity/100);
                ctx.textBaseline = 'alphabetic';
                const padding = fontSize;
                const metrics = ctx.measureText(text);
                let x, y;
                if (position.includes('r')) x = canvas.width - metrics.width - padding; else if (position.includes('l')) x = padding; else x = (canvas.width - metrics.width)/2;
                if (position.includes('b')) y = canvas.height - padding; else if (position.includes('t')) y = padding + fontSize; else y = canvas.height/2;
                ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = fontSize*0.15;
                ctx.fillText(text, x, y);
            };

            const download = () => {
                const canvas = canvasRef.current; if (!canvas) return;
                const link = document.createElement('a');
                link.download = 'watermarked.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.92);
                link.click();
            };

            const positions = [['tl','↖'],['tc','↑'],['tr','↗'],['ml','←'],['mc','•'],['mr','→'],['bl','↙'],['bc','↓'],['br','↘']];

            return (
                <div className="space-y-4 fade-in">
                    {!img ? (
                        <label className="panel p-16 rounded-[2rem] flex flex-col items-center justify-center border-dashed border-2 cursor-pointer group" style={{borderColor:'var(--line-strong)'}}>
                            <Icon name="download" className="w-10 h-10 mb-4 group-hover:scale-110 transition-transform" style={{color:'var(--gold-2)'}} />
                            <span className="font-medium text-zinc-500 uppercase tracking-widest text-[10px]">Učitaj sliku za watermark</span>
                            <input type="file" accept="image/*" onChange={handleUp} className="hidden"/>
                        </label>
                    ) : (
                        <div className="space-y-4">
                            <div className="rounded-[1.75rem] overflow-hidden border" style={{borderColor:'var(--line)'}}>
                                <canvas ref={canvasRef} className="w-full h-auto block" />
                            </div>
                            <div className="panel p-6 rounded-[2rem] space-y-4">
                                <div>
                                    <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Tekst potpisa</p>
                                    <input value={text} onChange={e=>setText(e.target.value)} />
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Boja teksta</p>
                                        <div className="flex gap-2">
                                            {['#ffffff','#cda43c','#000000'].map(c => (
                                                <button key={c} onClick={()=>setColor(c)} className={`w-8 h-8 rounded-full border-2 ${color===c?'border-[var(--gold-2)] scale-110':'border-transparent opacity-60'}`} style={{backgroundColor:c}} />
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Stil</p>
                                        <button onClick={()=>setItalic(v=>!v)} className={`w-full py-2 rounded-xl text-[11px] font-medium border ${italic?'nav-active border-transparent':'btn-muted'}`} style={italic?{}:{borderColor:'var(--line)'}}>Kurziv</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-2">
                                    {positions.map(([id,arrow]) => (
                                        <button key={id} onClick={()=>setPosition(id)} className={`py-3 rounded-xl text-sm border ${position===id?'nav-active border-transparent':'btn-muted'}`} style={position===id?{}:{borderColor:'var(--line)'}}>{arrow}</button>
                                    ))}
                                </div>
                                <div>
                                    <div className="flex justify-between mb-1"><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase">Prozirnost</p><p className="text-[10px] gold-text">{opacity}%</p></div>
                                    <input type="range" min="10" max="100" value={opacity} onChange={e=>setOpacity(Number(e.target.value))} />
                                </div>
                                <div>
                                    <div className="flex justify-between mb-1"><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase">Veličina</p><p className="text-[10px] gold-text">{size}%</p></div>
                                    <input type="range" min="5" max="100" value={size} onChange={e=>setSize(Number(e.target.value))} />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>{setImg(null);}} className="flex-1 py-3 rounded-2xl btn-muted text-[11px] font-semibold uppercase">Nova slika</button>
                                    <button onClick={download} className="flex-1 py-3 rounded-2xl btn-gold text-[11px] font-semibold uppercase flex items-center justify-center gap-2"><Icon name="download" className="w-4 h-4"/>Preuzmi</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODUL: ANALIZA (EXIF + HISTOGRAM + PRIVATNOST) ---
        const AnalysisModule = () => {
            const [image, setImage] = useState(null);
            const [data, setData] = useState(null);
            const [hist, setHist] = useState(null);
            const [tone, setTone] = useState(null);
            const [hasExif, setHasExif] = useState(false);
            const [loading, setLoading] = useState(false);
            const [scrubbed, setScrubbed] = useState(false);
            const fileRef = useRef(null);
            const imgElRef = useRef(null);

            const rgbToHex = (r,g,b) => '#' + [r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');

            const computeHistogram = (imgEl) => {
                const bins = 32;
                const c = document.createElement('canvas');
                const maxSize = 220;
                let w = imgEl.naturalWidth, h = imgEl.naturalHeight;
                if (w > h && w > maxSize) { h *= maxSize/w; w = maxSize; } else if (h > maxSize) { w *= maxSize/h; h = maxSize; }
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                ctx.drawImage(imgEl, 0, 0, w, h);
                let pixels;
                try { pixels = ctx.getImageData(0,0,w,h).data; } catch(e) { return { hist: null, tone: null }; }
                const buckets = new Array(bins).fill(0);
                let shadowN=0, midN=0, highN=0, rSum=0,gSum=0,bSum=0, warmN=0, coolN=0;
                const colorCounts = {};
                const n = pixels.length/4;
                for (let i=0; i<pixels.length; i+=4) {
                    const r=pixels[i], g=pixels[i+1], b=pixels[i+2];
                    const lum = 0.2126*r + 0.7152*g + 0.0722*b;
                    buckets[Math.min(bins-1, Math.floor(lum/256*bins))]++;
                    if (lum < 85) shadowN++; else if (lum < 170) midN++; else highN++;
                    rSum += r; gSum += g; bSum += b;
                    if (r > b + 12) warmN++; else if (b > r + 12) coolN++;
                    const qr = Math.round(r/32)*32, qg = Math.round(g/32)*32, qb = Math.round(b/32)*32;
                    const key = `${qr},${qg},${qb}`;
                    colorCounts[key] = (colorCounts[key]||0) + 1;
                }
                const max = Math.max(...buckets, 1);
                const dominant = Object.entries(colorCounts).sort((a,b)=>b[1]-a[1]).slice(0,5)
                    .map(([k]) => { const [r,g,b] = k.split(',').map(Number); return rgbToHex(r,g,b); });
                return {
                    hist: buckets.map(v => v/max),
                    tone: {
                        shadowsPct: Math.round(shadowN/n*100), midPct: Math.round(midN/n*100), highlightsPct: Math.round(highN/n*100),
                        avgHex: rgbToHex(rSum/n, gSum/n, bSum/n),
                        cast: warmN > coolN*1.15 ? 'topao' : coolN > warmN*1.15 ? 'hladan' : 'neutralan',
                        dominant
                    }
                };
            };

            const readExif = (f, imgEl) => new Promise((resolve) => {
                if (!window.EXIF) { resolve(null); return; }
                window.EXIF.getData(f, function() { resolve(window.EXIF.getAllTags(this)); });
            });

            const handleUp = (e) => {
                const f = e.target.files[0]; if (!f) return;
                fileRef.current = f;
                setLoading(true); setData(null); setHist(null); setTone(null); setScrubbed(false);
                const url = URL.createObjectURL(f);
                const img = new Image();
                img.onload = async () => {
                    imgElRef.current = img;
                    setImage(url);
                    const { hist: h, tone: tn } = computeHistogram(img);
                    setHist(h); setTone(tn);
                    const t = await readExif(f, img) || {};
                    const hasAnyExif = !!(t.ExposureTime || t.FNumber || t.ISOSpeedRatings || t.Make || t.Model || t.LensModel);
                    setHasExif(hasAnyExif);
                    const programs = { 1: "Manual", 2: "Normal", 3: "Aperture Priority", 4: "Shutter Priority" };
                    setData({
                        fiz: [{l:"Rezolucija", v:`${img.naturalWidth} x ${img.naturalHeight} px`}, {l:"Veličina", v:(f.size/1048576).toFixed(2)+" MB"}, {l:"Format", v:f.type.split('/')[1].toUpperCase()}],
                        exp: [{l:"Vrijeme", v:t.ExposureTime?`1/${Math.round(1/t.ExposureTime)}s`:"---"}, {l:"Blenda", v:t.FNumber?`f/${t.FNumber}`:"---"}, {l:"ISO", v:t.ISOSpeedRatings||"---"}, {l:"Program", v:programs[t.ExposureProgram] || "Auto"}],
                        opt: [{l:"Objektiv", v:t.LensModel || "N/A"}, {l:"Aparat", v:(t.Make||"") + " " + (t.Model||"")}],
                        gps: [{l:"GPS lokacija", v:(t.GPSLatitude && t.GPSLongitude) ? "Zapisana u datoteci" : "Nema"}]
                    });
                    setLoading(false);
                };
                img.src = url;
            };

            const downloadClean = () => {
                const img = imgElRef.current; if (!img) return;
                const c = document.createElement('canvas');
                c.width = img.naturalWidth; c.height = img.naturalHeight;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const link = document.createElement('a');
                link.download = 'bez-metapodataka.jpg';
                link.href = c.toDataURL('image/jpeg', 0.95);
                link.click();
                setScrubbed(true);
            };

            const Row = ({l,v}) => <div className="flex justify-between items-center py-2 row-line text-[11px] font-medium"><span className="text-zinc-500 font-semibold uppercase tracking-wider">{l}</span><span className="text-[var(--text)] font-medium truncate max-w-[150px] ml-4">{v||"---"}</span></div>;

            return (
                <div className="space-y-6 fade-in">
                    {!image ? ( <label className="panel p-16 rounded-[2rem] flex flex-col items-center justify-center border-dashed border-2 cursor-pointer group" style={{borderColor:'var(--line-strong)'}}> <Icon name="image" className="w-10 h-10 mb-4 group-hover:scale-110 transition-transform" style={{color:'var(--gold-2)'}} /><span className="font-medium text-zinc-500 uppercase tracking-widest text-[10px]">Učitaj sliku za analizu</span><input type="file" accept="image/*" onChange={handleUp} className="hidden"/><span className="text-[9px] text-zinc-700 mt-3 uppercase tracking-widest">Sve ostaje u ovom uređaju — ništa se ne uploada</span></label> ) : (
                        <div className="space-y-4">
                            <div className="relative rounded-[1.75rem] overflow-hidden border" style={{borderColor:'var(--line)'}}><img src={image} className="w-full h-auto" /><button onClick={()=>{setImage(null); setData(null); setHist(null); setTone(null); setScrubbed(false);}} className="absolute top-4 right-4 bg-black/70 p-2 rounded-full font-semibold border" style={{borderColor:'var(--line-strong)'}}>✕</button></div>
                            {loading ? <p className="text-center py-4 animate-pulse uppercase text-xs font-semibold tracking-widest gold-text">Skeniranje...</p> : data && (
                                <div className="space-y-4 pb-12">
                                    <div className="panel p-5 rounded-[1.75rem] border-l-2" style={{borderColor: hasExif ? 'var(--gold-2)' : 'rgba(226,104,90,0.6)'}}>
                                        <div className="flex items-start gap-3">
                                            <Icon name={hasExif ? "alert" : "check"} className="w-5 h-5 mt-0.5 flex-shrink-0" style={{color: hasExif ? 'var(--danger)' : 'var(--gold-2)'}} />
                                            <div className="flex-1">
                                                <h4 className="text-[10px] font-semibold uppercase gold-text mb-1 italic tracking-widest">Privatnost / EXIF</h4>
                                                <p className="text-[11px] text-zinc-400 leading-relaxed">{hasExif ? 'Datoteka sadrži tehničke metapodatke (možda i GPS lokaciju). Prije slanja klijentu ili objave online, preporučamo čišćenje.' : 'Nisu pronađeni EXIF metapodaci u ovoj datoteci.'}</p>
                                            </div>
                                        </div>
                                        <button onClick={downloadClean} className="w-full mt-4 py-3 rounded-2xl btn-gold text-[11px] font-semibold uppercase flex items-center justify-center gap-2"><Icon name="download" className="w-4 h-4"/>{scrubbed ? 'Preuzeto — spremi ponovno' : 'Preuzmi čistu kopiju (bez EXIF-a)'}</button>
                                        <p className="text-[9px] text-zinc-700 mt-2 text-center">Obrada se odvija lokalno u pregledniku — slika se nikad ne šalje na server.</p>
                                    </div>
                                    {hist && (
                                        <div className="panel p-5 rounded-[1.75rem] border-l-2" style={{borderColor:'var(--gold-2)'}}>
                                            <h4 className="text-[10px] font-semibold uppercase text-[var(--text-dim)] mb-3 italic tracking-widest">Histogram (luminancija)</h4>
                                            <div className="flex items-end gap-[2px] h-20">
                                                {hist.map((v,i) => <div key={i} className="flex-1 rounded-t-sm" style={{height:`${Math.max(v*100,2)}%`, background:'linear-gradient(180deg, var(--gold-1), var(--gold-3))'}} />)}
                                            </div>
                                            <div className="flex justify-between mt-1 text-[8px] text-zinc-600 uppercase tracking-widest"><span>Sjene</span><span>Sredina</span><span>Svjetla</span></div>
                                        </div>
                                    )}
                                    {tone && (
                                        <div className="panel p-5 rounded-[1.75rem] border-l-2" style={{borderColor:'var(--gold-2)'}}>
                                            <h4 className="text-[10px] font-semibold uppercase gold-text mb-3 italic tracking-widest">Analiza tonova (bez AI-a)</h4>
                                            <Row l="Sjene / Sredina / Svjetla" v={`${tone.shadowsPct}% / ${tone.midPct}% / ${tone.highlightsPct}%`} />
                                            <Row l="Ukupni ton" v={tone.cast === 'topao' ? 'Topao (žuto/crveni)' : tone.cast === 'hladan' ? 'Hladan (plavi)' : 'Neutralan'} />
                                            <p className="text-[10px] text-zinc-600 mt-2 mb-2 uppercase tracking-widest font-semibold">Dominantne boje</p>
                                            <div className="flex gap-2">
                                                {tone.dominant.map((c,i) => <div key={i} className="flex-1 h-10 rounded-lg border" style={{backgroundColor:c, borderColor:'var(--line)'}} title={c} />)}
                                            </div>
                                            <p className="text-[9px] text-zinc-700 mt-3 leading-relaxed">Izračunato čistom matematikom (histogram i dominantne boje) — koristi kao polazište za color grading referentne fotografije.</p>
                                        </div>
                                    )}
                                    {Object.entries(data).map(([key, items]) => (
                                        <div key={key} className="panel p-5 rounded-[1.75rem] border-l-2" style={{borderColor:'var(--gold-2)'}}>
                                            <h4 className="text-[10px] font-semibold uppercase gold-text mb-3 italic tracking-widest">{key==='fiz'?'Fizika i Datoteka':key==='exp'?'Ekspozicija':key==='gps'?'Lokacija':'Optički Profil'}</h4>
                                            {items.map((it, i) => <Row key={i} l={it.l} v={it.v} />)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // --- MODUL: KALKULATOR VELIČINE ISPISA ---
        const PrintModule = ({ units }) => {
            const [w, setW] = useState(6000);
            const [h, setH] = useState(4000);
            const [dpi, setDpi] = useState(300);
            const fileRef = useRef(null);

            const handleUp = (e) => {
                const f = e.target.files[0]; if (!f) return;
                const img = new Image();
                img.onload = () => { setW(img.naturalWidth); setH(img.naturalHeight); URL.revokeObjectURL(img.src); };
                img.src = URL.createObjectURL(f);
            };

            const cmW = (w/dpi*2.54).toFixed(1), cmH = (h/dpi*2.54).toFixed(1);
            const inW = (w/dpi).toFixed(1), inH = (h/dpi).toFixed(1);
            const imperial = units === 'imperial';

            const targets = [
                { n: '10×15 cm', cw: 10, ch: 15 },
                { n: '13×18 cm', cw: 13, ch: 18 },
                { n: 'A4 (21×29.7 cm)', cw: 21, ch: 29.7 },
                { n: 'A3 (29.7×42 cm)', cw: 29.7, ch: 42 },
                { n: 'Poster 50×70 cm', cw: 50, ch: 70 },
                { n: 'Veliki poster 100×150 cm', cw: 100, ch: 150 }
            ];
            const dpiFor = (cw, ch) => {
                const longPx = Math.max(w,h), shortPx = Math.min(w,h);
                const longCm = Math.max(cw,ch), shortCm = Math.min(cw,ch);
                return Math.min(longPx/longCm, shortPx/shortCm) * 2.54;
            };
            const quality = (d) => d >= 300 ? { l: 'Fotografska kvaliteta', c: 'var(--gold-2)' } : d >= 200 ? { l: 'Dobra za gledanje izbliza', c: '#cda43c' } : d >= 100 ? { l: 'Ok za gledanje s udaljenosti', c: '#948c7c' } : { l: 'Preslabo — piksela će se vidjeti', c: 'var(--danger)' };

            return (
                <div className="space-y-4 fade-in">
                    <div className="panel p-6 rounded-[2rem] space-y-5">
                        <label className="w-full py-4 rounded-2xl btn-muted text-[10px] font-semibold uppercase flex items-center justify-center gap-2 cursor-pointer" style={{borderColor:'var(--line)'}}>
                            <Icon name="image" className="w-4 h-4"/> Učitaj sliku (automatski očita rezoluciju)
                            <input type="file" accept="image/*" onChange={handleUp} className="hidden" />
                        </label>
                        <div className="grid grid-cols-2 gap-3">
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Širina (px)</p><input type="number" value={w} onChange={e=>setW(Number(e.target.value)||1)} /></div>
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Visina (px)</p><input type="number" value={h} onChange={e=>setH(Number(e.target.value)||1)} /></div>
                        </div>
                        <div>
                            <div className="flex justify-between mb-1"><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase">Ciljani DPI</p><p className="text-[11px] gold-text font-semibold">{dpi} dpi</p></div>
                            <input type="range" min="100" max="360" step="10" value={dpi} onChange={e=>setDpi(Number(e.target.value))} />
                        </div>
                        <div className="panel-marked bg-black p-6 rounded-2xl border-l-2 text-center" style={{borderColor:'var(--gold-2)'}}>
                            <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest mb-1">Maksimalna preporučena veličina ispisa</p>
                            <p className="text-3xl font-display italic gold-text tracking-tight">{imperial ? `${inW} × ${inH} in` : `${cmW} × ${cmH} cm`}</p>
                        </div>
                    </div>
                    <div className="panel p-6 rounded-[2rem]">
                        <p className="text-[9px] text-[var(--text-dim)] uppercase font-semibold tracking-widest mb-3">Standardni formati — potreban DPI za tvoju datoteku</p>
                        <div className="space-y-2">
                            {targets.map(t => {
                                const d = dpiFor(t.cw, t.ch);
                                const q = quality(d);
                                return (
                                    <div key={t.n} className="flex justify-between items-center bg-black/30 p-3 rounded-xl border" style={{borderColor:'var(--line)'}}>
                                        <span className="text-[10px] text-zinc-400 uppercase font-semibold tracking-wide">{t.n}</span>
                                        <span className="text-[11px] font-semibold" style={{color:q.c}}>{Math.round(d)} dpi — {q.l}</span>
                                    </div>
                                );
                            })}
                        </div>
                        <p className="text-[9px] text-zinc-700 mt-3 leading-relaxed">300 dpi = standard za tisak izbliza (albumi, portreti u ruci). Za velike postere koji se gledaju s udaljenosti, 100–150 dpi je sasvim dovoljno.</p>
                    </div>
                </div>
            );
        };

        // --- MODUL: UGOVORI I PRIVOLE ---
        const ContractsModule = ({ photographerDefault }) => {
            const [docType, setDocType] = useState('contract');
            const [photographer, setPhotographer] = useState(photographerDefault || 'Kezić Vizuali — Krunoslav Kezić');
            const [client, setClient] = useState('');
            const [date, setDate] = useState('');
            const [location, setLocation] = useState('');
            const [service, setService] = useState('');
            const [price, setPrice] = useState('');
            const [subject, setSubject] = useState('');
            const [minor, setMinor] = useState(false);
            const [guardian, setGuardian] = useState('');
            const [usage, setUsage] = useState('web i društvene mreže');
            const printRef = useRef(null);

            const today = new Date().toLocaleDateString('hr-HR');

            const contractText = `UGOVOR O FOTOGRAFIRANJU\n\nSklopljen dana ${date || '____________'} u ${location || '____________'} između:\n\n1) ${photographer || '____________'} (u daljnjem tekstu: Fotograf)\n2) ${client || '____________'} (u daljnjem tekstu: Naručitelj)\n\nČlanak 1. — Predmet ugovora\nFotograf se obvezuje za Naručitelja izvršiti sljedeću uslugu fotografiranja: ${service || '____________'}.\n\nČlanak 2. — Cijena i plaćanje\nZa uslugu iz članka 1. ugovara se naknada u iznosu od ${price || '____________'} EUR. Način i rok plaćanja dogovaraju se posebno između strana.\n\nČlanak 3. — Autorska prava\nFotograf zadržava autorska prava na svim fotografijama sukladno Zakonu o autorskom pravu i srodnim pravima. Naručitelj stječe pravo korištenja isporučenih fotografija u dogovorenu svrhu, osim ako je drugačije pisano ugovoreno.\n\nČlanak 4. — Otkaz i nepredviđene okolnosti\nU slučaju otkaza od strane Naručitelja manje od 48 sati prije termina, Fotograf zadržava pravo naplate dijela ili cijele ugovorene naknade. U slučaju više sile (bolest, vremenske nepogode i sl.), strane dogovaraju novi termin.\n\nČlanak 5. — Isporuka\nFotograf se obvezuje isporučiti obrađene fotografije u dogovorenom roku i formatu.\n\nČlanak 6. — Završne odredbe\nZa sve što nije regulirano ovim ugovorom primjenjuju se odredbe Zakona o obveznim odnosima RH. Eventualne sporove strane će pokušati riješiti mirnim putem, a u suprotnom nadležan je sud prema sjedištu Fotografa.\n\n\nFotograf: _______________________          Naručitelj: _______________________\n\nMjesto i datum: ${location || '____________'}, ${date || '____________'}`;

            const releaseText = `PRIVOLA ZA KORIŠTENJE FOTOGRAFIJA (MODEL RELEASE)\n\nJa, ${subject || '____________'}${minor ? `, kojeg/koju zastupa zakonski skrbnik ${guardian || '____________'}` : ''}, dajem privolu fotografu ${photographer || '____________'} da fotografije nastale dana ${date || '____________'} u ${location || '____________'} koristi u sljedeće svrhe: ${usage || '____________'}.\n\nPrivola uključuje pravo obrade, javnog prikazivanja i objave fotografija u navedenu svrhu. Fotograf se obvezuje ne koristiti fotografije u svrhe koje bi mogle štetiti ugledu ili dostojanstvu osobe na fotografiji.\n\nOva privola vrijedi od datuma potpisa i može se opozvati pisanim putem, s time da se opoziv ne odnosi na već objavljeni materijal.\n\n${minor ? 'Potpis zakonskog skrbnika: _______________________' : 'Potpis: _______________________'}\n\nMjesto i datum: ${location || '____________'}, ${date || '____________'}`;

            const gdprText = `PRIVOLA ZA OBRADU OSOBNIH PODATAKA (GDPR)\n\nOvom privolom, ${client || subject || '____________'} daje suglasnost fotografskom studiju ${photographer || '____________'} za prikupljanje i obradu osobnih podataka (ime, kontakt podaci, fotografije) u svrhu: ${service || usage || '____________'}.\n\nOsobni podaci obrađuju se sukladno Općoj uredbi o zaštiti podataka (GDPR, EU 2016/679) i neće se ustupati trećim stranama bez posebne privole, osim kada je to zakonom propisano.\n\nOsoba čiji se podaci obrađuju ima pravo na uvid, ispravak, brisanje i prigovor na obradu podataka, sukladno članku 15.–21. GDPR-a, obraćanjem na kontakt fotografa.\n\nPodaci se čuvaju: ${' '}dok traje poslovni odnos i zakonski propisani rok čuvanja računovodstvene dokumentacije.\n\nPotpis: _______________________\n\nMjesto i datum: ${location || '____________'}, ${date || today}`;

            const docs = {
                contract: { n: 'Ugovor o fotografiranju', t: contractText },
                release: { n: 'Privola za korištenje fotografija', t: releaseText },
                gdpr: { n: 'GDPR privola', t: gdprText }
            };

            const doPrint = () => {
                const w = window.open('', '_blank');
                w.document.write(`<html><head><title>${docs[docType].n}</title><style>
                    body{font-family:Georgia,serif;white-space:pre-wrap;line-height:1.6;padding:40px;max-width:700px;margin:0 auto;color:#111;}
                    h1{font-size:14px;letter-spacing:0.05em;}
                    </style></head><body>${docs[docType].t.replace(/</g,'&lt;')}</body></html>`);
                w.document.close();
                w.focus();
                setTimeout(()=>w.print(), 300);
            };

            const copyText = async () => {
                try { await navigator.clipboard.writeText(docs[docType].t); } catch(e) {}
            };

            return (
                <div className="space-y-4 fade-in">
                    <div className="panel p-4 rounded-[1.5rem] flex items-start gap-3 border-l-2" style={{borderColor:'rgba(226,104,90,0.6)'}}>
                        <Icon name="alert" className="w-5 h-5 mt-0.5 flex-shrink-0" style={{color:'var(--danger)'}} />
                        <p className="text-[10px] text-zinc-400 leading-relaxed">Ovo su generički predlošci, ne pravni savjet. Za ugovore veće vrijednosti ili posebne situacije (maloljetnici, komercijalna uporaba) preporučamo provjeru kod odvjetnika prije korištenja.</p>
                    </div>
                    <div className="flex p-1 bg-black/30 rounded-2xl border overflow-x-auto scrollbar-hide" style={{borderColor:'var(--line)'}}>
                        {Object.entries(docs).map(([id,d]) => (
                            <button key={id} onClick={()=>setDocType(id)} className={`flex-1 min-w-[110px] py-2 rounded-xl text-[9.5px] font-medium tracking-wide transition-all whitespace-nowrap px-2 ${docType===id?'nav-active':'text-zinc-500'}`}>{d.n}</button>
                        ))}
                    </div>
                    <div className="panel p-6 rounded-[2rem] space-y-3">
                        <div className="grid grid-cols-2 gap-3">
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Fotograf / studio</p><input value={photographer} onChange={e=>setPhotographer(e.target.value)} /></div>
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Datum</p><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
                        </div>
                        {docType !== 'release' && (
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Naručitelj / klijent</p><input value={client} onChange={e=>setClient(e.target.value)} /></div>
                        )}
                        <div className="grid grid-cols-2 gap-3">
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Mjesto</p><input value={location} onChange={e=>setLocation(e.target.value)} /></div>
                            {docType==='contract' && <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Cijena (EUR)</p><input value={price} onChange={e=>setPrice(e.target.value)} /></div>}
                        </div>
                        {docType !== 'release' && (
                            <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Vrsta usluge / svrha obrade</p><input value={service} onChange={e=>setService(e.target.value)} /></div>
                        )}
                        {docType === 'release' && (
                            <div className="space-y-3 pt-2 border-t" style={{borderColor:'var(--line)'}}>
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Osoba na fotografiji</p><input value={subject} onChange={e=>setSubject(e.target.value)} /></div>
                                <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Svrha korištenja</p><input value={usage} onChange={e=>setUsage(e.target.value)} /></div>
                                <button onClick={()=>setMinor(v=>!v)} className={`w-full py-2 rounded-xl text-[10px] font-medium border ${minor?'nav-active border-transparent':'btn-muted'}`} style={minor?{}:{borderColor:'var(--line)'}}>Osoba je maloljetna</button>
                                {minor && <div><p className="text-[8px] text-[var(--text-dim)] font-semibold uppercase mb-1">Zakonski skrbnik</p><input value={guardian} onChange={e=>setGuardian(e.target.value)} /></div>}
                            </div>
                        )}
                    </div>
                    <div className="panel p-6 rounded-[2rem]">
                        <pre className="text-[10px] text-zinc-400 leading-relaxed whitespace-pre-wrap font-sans max-h-72 overflow-y-auto">{docs[docType].t}</pre>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={copyText} className="flex-1 py-3 rounded-2xl btn-muted text-[11px] font-semibold uppercase">Kopiraj tekst</button>
                        <button onClick={doPrint} className="flex-1 py-3 rounded-2xl btn-gold text-[11px] font-semibold uppercase flex items-center justify-center gap-2"><Icon name="download" className="w-4 h-4"/>Ispis / Spremi kao PDF</button>
                    </div>
                </div>
            );
        };

        // --- MODUL: UPUTE ---
        const GuideModule = () => {
            const [open, setOpen] = useState('lighting');

            const guides = [
                { id: 'lighting', n: 'Rasvjeta', i: 'light', desc: 'Simulator postava svjetla — za studio i za teren.', steps: [
                    'Klikni "Studio" ili "Teren" da odabereš okruženje.',
                    'U Studiju klikni shemu (Rembrandt, Butterfly, Split, Clamshell) da vidiš raspored svjetla na modelu. Na Terenu klikni Zlatni sat, Podne ili Plavi sat.',
                    'U Studiju klikni jedan od kružića boje da promijeniš gel filter na glavnom svjetlu.',
                    'Uključi ili isključi KEY, FILL i RIM gumbe da isprobaš kombinacije više izvora svjetla odjednom.',
                    'Na dnu pogledaj Kelvin vodič — pomaže ti odabrati bijelu ravnotežu prema izvoru svjetla na terenu.'
                ]},
                { id: 'exposure', n: 'Optika', i: 'zap', desc: 'Kalkulator ekspozicije za tri različite situacije snimanja.', steps: [
                    'Klikni "ND filtar", "Sunny 16" ili "Bljeskalica" da odabereš vrstu izračuna.',
                    'Kod ND filtra odaberi ISO, blendu i baznu brzinu zatvarača, pa klizačem odaberi jačinu ND filtra — dobiješ novu ekspoziciju, uz automatsku korekciju recipročnosti za duge ekspozicije na filmu.',
                    'Kod Sunny 16 odaberi ISO i vidiš tablicu preporučenih blendi za pet uvjeta osvjetljenja terena.',
                    'Za Bljeskalicu upiši Guide Number bljeskalice, odaberi ISO i pomakni klizač udaljenosti do motiva — aplikacija izračuna potrebnu blendu.',
